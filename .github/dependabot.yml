# Weekly dependency updates. Minor and patch bumps come as one grouped PR per ecosystem;
# major bumps stay separate so their changelogs get read.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm # backend uses pnpm; Dependabot detects it from pnpm-lock.yaml
    directory: /backend
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
