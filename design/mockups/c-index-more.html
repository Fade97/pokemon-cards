<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Index more screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --page:#E6ECF3; --surface:#F7F9FC; --raised:#FFFFFF; --ink:#14233D; --muted:#56657E;
  --line:#D3DCE7; --empty:#E3E9F1; --action:#2346A6; --action-ink:#FFFFFF; --warn:#9A5A00;
  /* energy fills, tuned so their slot numbers reach 4.5:1 (white on the dark ones, ink on lightning/colorless/trainer) */
  --grass:#40813C; --fire:#CD4321; --water:#3274C6; --lightning:#E2AE1C; --psychic:#9555BF;
  --fighting:#A66239; --dark:#3B4055; --colorless:#A8A196; --trainer:#8C96A6;
  --r-lg:22px; --r-md:12px; --r-sm:7px;
}
*{box-sizing:border-box;margin:0}
body{background:var(--page);color:var(--ink);font-family:"Schibsted Grotesk",system-ui,sans-serif;
  line-height:1.4;padding:40px 16px 32px}
.num,.cand .n,.row-n{font-variant-numeric:tabular-nums}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--action);outline-offset:2px}
.intro{max-width:1520px;margin:0 auto 32px;display:flex;flex-wrap:wrap;gap:8px 40px;align-items:baseline}
.intro h1{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.intro h1 small{display:block;font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:8px}
.intro p{max-width:56ch;color:var(--muted);font-size:17px}
.intro b{color:var(--ink)}
.row{display:flex;gap:40px 28px;justify-content:center;flex-wrap:wrap;max-width:1560px;margin:0 auto}
figure{display:flex;flex-direction:column;gap:12px;width:360px;max-width:100%}
figcaption{font-size:14px;color:var(--muted);padding-left:6px}
figcaption b{color:var(--ink);font-weight:700;margin-right:6px}
.phone{width:360px;max-width:100%;height:780px;background:var(--surface);border-radius:40px;border:10px solid #1C2638;
  overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 30px 60px -30px rgba(20,35,61,.45)}
.status{height:30px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12px;font-weight:600}
.scroll{flex:1;overflow-y:auto;padding:4px 18px 18px}
.top{display:flex;justify-content:space-between;align-items:center;padding:2px 0 10px;gap:8px;min-height:48px}
.top h2{font-size:22px;font-weight:700;letter-spacing:-.01em}
.ghost{background:none;border:0;color:var(--action);font-weight:600;font-size:15px;min-height:44px;padding:0 6px}
/* bottom navigation: real buttons, 58px targets, Material 3 indicator */
.nav{flex:none;display:flex;border-top:1px solid var(--line);background:var(--raised);padding:6px 4px 2px}
.nav button{flex:1;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:0;font-size:12px;font-weight:600;color:var(--muted);border-radius:var(--r-md)}
.nav .ic{width:56px;height:30px;border-radius:15px;display:grid;place-items:center}
.nav [aria-current=page]{color:var(--ink);font-weight:700}
.nav [aria-current=page] .ic{background:#D9E2F3}
/* top app bar with a back arrow (pushed screens) */
.appbar{display:flex;align-items:center;gap:2px;min-height:56px;margin:0 -12px 6px}
.appbar h2{flex:1;min-width:0;font-size:20px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar .ghost{padding:0 12px}
.appbar .qpos{margin-right:12px}
.icon-btn{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:none;border:0;color:var(--ink)}
.icon-btn:hover{background:#E6ECF4}
.icon-btn svg,.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* gesture navigation inset: content ends above the home indicator */
.phone{padding-bottom:18px}
.gesture{position:absolute;left:0;right:0;bottom:0;height:18px;display:grid;place-items:center;pointer-events:none;z-index:6}
.gesture::after{content:"";width:110px;height:4px;border-radius:2px;background:var(--ink);opacity:.6}
.phone.cam{background:var(--surface)}.phone.cam .status{background:#101722}
/* placeholder card face */
.card{border-radius:9px;padding:7px;display:flex;flex-direction:column;gap:5px;color:#fff;aspect-ratio:63/88;position:relative;overflow:hidden}
.card .nm{display:flex;justify-content:space-between;font-weight:700;font-size:13px}
.card .art{flex:1;border-radius:4px;background:rgba(255,255,255,.22);position:relative;overflow:hidden}
.card .art::after{content:"";position:absolute;width:62%;aspect-ratio:1;border-radius:46% 54% 40% 60%;background:rgba(255,255,255,.35);left:20%;top:16%}
.card .tx{height:28%;border-radius:4px;background:rgba(255,255,255,.88)}
.card .no{font-size:10px;font-weight:600;align-self:flex-start;background:rgba(0,0,0,.35);padding:1px 5px;border-radius:4px}
.fire{background:var(--fire)}.grass{background:var(--grass)}.lightning{background:var(--lightning)}.psychic{background:var(--psychic)}
.num{font-weight:800;letter-spacing:-.045em;line-height:.9;font-size:72px}
.num span{color:var(--muted);font-weight:500}
.num.mid{font-size:44px}
h3{font-size:15px;font-weight:700;margin:16px 0 7px}
/* chips: 36px visual, 44px hit area */
.chips{display:flex;flex-wrap:wrap;gap:8px 6px}
.chip{position:relative;min-height:36px;border:1.5px solid var(--line);background:var(--raised);border-radius:var(--r-sm);padding:0 11px;font-size:14px;font-weight:600}
.chip::before{content:"";position:absolute;inset:-5px -1px}
.chip.sm{padding:0 10px;font-size:13px}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.foot{flex:none;padding:12px 18px 16px;border-top:1px solid var(--line);background:var(--raised);display:flex;gap:10px}
.primary{flex:1;min-height:48px;background:var(--action);color:var(--action-ink);border:0;border-radius:var(--r-md);padding:0 14px;font-weight:700;font-size:16px}
.primary:disabled{background:#A9B5CB;cursor:not-allowed}
.secondary{min-height:48px;background:none;border:1.5px solid var(--line);border-radius:var(--r-md);padding:0 16px;font-weight:600}
.lede{font-size:15px;color:var(--muted);max-width:34ch}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.slots{display:grid;grid-template-columns:repeat(15,1fr);gap:2px}
.slots i{aspect-ratio:1;border-radius:3px;background:var(--empty)}
/* 1 onboarding */
.packs{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.pack{display:grid;grid-template-columns:40px 1fr auto 22px;align-items:center;gap:10px;min-height:48px;background:none;border:0;border-bottom:1px solid var(--line);padding:6px 2px;text-align:left}
.pack .code{font-weight:800;font-size:15px;letter-spacing:-.01em}
.pack .lang{font-weight:600}
.pack .sz{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pack .box{width:20px;height:20px;border-radius:5px;border:1.5px solid #9FB0C8;display:grid;place-items:center}
.pack[aria-pressed=true] .box{background:var(--action);border-color:var(--action)}
.pack[aria-pressed=true] .box::after{content:"";width:9px;height:5px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.pack:disabled{cursor:default;color:var(--muted)}
.pack:disabled .code{color:var(--muted)}
.pack:disabled .box{display:none}
.pack:disabled .sz{grid-column:3/5;font-style:italic}
.device{display:flex;gap:10px;align-items:flex-start;background:#EEF2FC;border-radius:var(--r-md);padding:10px 12px;font-size:13px;color:var(--ink);margin-top:14px}
.device i{flex:none;width:8px;height:8px;margin-top:6px;border-radius:50%;background:var(--action)}
/* 2 empty state */
.empty{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 26px;gap:12px}
.ghostgrid{width:100%;margin-bottom:18px}
.ghostgrid i{background:none;border:1.5px dashed #B4C1D3}
.ghostgrid i.lit{background:var(--grass);border:0}
.empty h2{font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1.1}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.stack .primary{flex:none}
.link{background:none;border:0;color:var(--action);font-weight:600;min-height:44px;text-align:center}
/* 3 no match: non-blocking banner, camera keeps scanning */
.cam{background:#101722;color:#E8EEF7}
.view{flex:1;position:relative;overflow:hidden;background:radial-gradient(120% 70% at 50% 45%,#2B3446 0%,#151C28 70%)}
.table{position:absolute;inset:auto -10% -6% -10%;height:46%;background:#3A3027;transform:perspective(500px) rotateX(28deg);opacity:.75}
.scan-card{position:absolute;width:106px;left:127px;top:128px;transform:rotate(3deg);filter:saturate(.9) brightness(.92)}
.scan-card.glare::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.9) 52%,transparent 68%)}
.frame{position:absolute;left:118px;top:118px;width:124px;height:168px;transform:rotate(3deg);border-radius:12px;border:3px dashed #F2B64C}
.read{position:absolute;left:0;right:0;top:46px;text-align:center}
.read .num{font-size:54px;color:#fff}
.read .num span{color:#A3B2C8}
.read p{font-size:14px;color:#C2CDDD;margin-top:6px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.auto{position:absolute;top:12px;left:16px;background:rgba(255,255,255,.12)}
.auto i{width:8px;height:8px;border-radius:50%;background:#62D27A}
@media (prefers-reduced-motion:no-preference){.auto i{animation:blink 1.6s ease-in-out infinite}}
@keyframes blink{50%{opacity:.3}}
.banner{position:absolute;left:12px;right:12px;bottom:12px;background:var(--raised);color:var(--ink);border-radius:var(--r-md);border-left:5px solid #F2B64C;padding:12px 14px 6px;box-shadow:0 14px 30px -12px rgba(0,0,0,.6)}
.banner b{display:block;font-size:16px}
.banner p{font-size:13.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.bacts{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.bacts .primary{flex:none;min-height:44px;font-size:14px;padding:0 14px}
.bacts .link{padding:0 8px;font-size:14px}
.tray{flex:none;background:var(--surface);color:var(--ink);border-radius:20px 20px 0 0;padding:14px 18px 16px}
.counts{display:flex;justify-content:space-between;align-items:center}
.counts strong{font-size:34px;font-weight:800;letter-spacing:-.03em}
.counts strong small{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:4px}
.review-btn{min-height:44px;border:0;border-radius:999px;padding:0 16px;background:#FFF1D6;color:var(--warn);font-weight:700;font-size:14px}
.done{width:100%;min-height:48px;margin-top:10px;background:var(--ink);color:#fff;border:0;border-radius:var(--r-md);font-weight:700;font-size:16px}
.state{display:flex;flex-wrap:wrap;align-items:center;gap:8px 6px;margin-top:10px}
.state>span{font-size:13px;font-weight:700;color:var(--ink);margin-right:4px}
/* 4 search */
.field{display:flex;align-items:center;gap:8px;background:var(--raised);border:1.5px solid var(--line);border-radius:var(--r-md);padding:0 12px}
.field:focus-within{border-color:var(--action)}
.field input{flex:1;border:0;background:none;padding:12px 0;font-size:16px;font-weight:600;outline:none;min-width:0}
.field .clear{background:none;border:0;color:var(--muted);font-size:14px;font-weight:600;min-height:44px;padding:0 6px}
.filters{display:flex;flex-direction:column;gap:8px;margin:12px 0 4px}
.results{list-style:none;padding:0;margin-top:10px}
.res{display:grid;grid-template-columns:78px 1fr auto;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row-n{font-size:19px;font-weight:800;letter-spacing:-.03em}
.res .t{font-size:13px;color:var(--muted);min-width:0}
.res .t b{display:block;font-size:15px;color:var(--ink)}
.res .own{display:inline-block;margin-left:4px;font-size:12px;font-weight:700;color:#1F7A3A}
.res .addb{position:relative;min-height:36px;border:1.5px solid var(--line);background:var(--raised);border-radius:var(--r-sm);padding:0 14px;font-weight:700;font-size:14px;color:var(--action)}
.res .addb::before{content:"";position:absolute;inset:-5px -4px}
.count{font-size:13px;color:var(--muted);margin-top:12px}
.noresult{font-size:14px;color:var(--muted);padding:16px 0}
/* 5 set detail */
.sethead{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
.sethead .num{font-size:52px}
.sethead p{font-size:14px;color:var(--muted)}
.sethead .v{text-align:right;font-weight:700;font-size:17px}
/* compact grid: every slot is a 34px button; owned = filled + check, missing = dashed outline */
.big{grid-template-columns:repeat(8,1fr);gap:4px;margin-top:12px}
.big button{position:relative;aspect-ratio:1;min-height:32px;border:1.5px solid transparent;border-radius:5px;padding:0 0 3px 4px;display:flex;align-items:flex-end;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;color:#fff;background:none}
.big button.lt{color:var(--ink)}
.big button.own::after{content:"";position:absolute;right:5px;top:6px;width:8px;height:4px;border:2px solid currentColor;border-top:0;border-right:0;transform:rotate(-45deg)}
.big button.miss{border:1.5px dashed #6F7E96;color:#4B5A73;background:transparent}
.big button.sel{outline:3px solid var(--ink);outline-offset:1px}
.big button.off{opacity:.2}
.miss-list{list-style:none;padding:0;margin-top:6px}
.setbar{display:flex;flex-direction:column;gap:10px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--raised);overflow:hidden}
.seg button{flex:1;min-height:44px;border:0;background:none;padding:0 9px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
.item .seg{margin:10px 0 2px}
.item .seg button{font-size:13px}
.cards{display:none;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}
.sd.v-cards .big{display:none}.sd.v-cards .cards{display:grid}
.mini{border-radius:6px;padding:4px;display:flex;flex-direction:column;gap:3px;aspect-ratio:63/88;color:#fff;position:relative;overflow:hidden;border:0;text-align:left}
.mini .nm{position:relative;z-index:1;font-size:8.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:13px;background:rgba(20,35,61,.72);border-radius:3px;padding:0 3px;align-self:flex-start;max-width:100%}
.mini .nm:empty{background:none}
.mini .art{flex:1;border-radius:3px;background:rgba(255,255,255,.24);position:relative;overflow:hidden}
.mini .art::after{content:"";position:absolute;width:64%;aspect-ratio:1;border-radius:46% 54% 40% 60%;background:rgba(255,255,255,.4);left:18%;top:14%}
.mini .no{position:relative;z-index:1;font-size:9px;font-weight:700;background:rgba(20,35,61,.78);border-radius:3px;padding:0 4px;align-self:flex-start;font-variant-numeric:tabular-nums}
.mini .tag{position:absolute;z-index:1;right:4px;bottom:4px;font-size:8.5px;font-weight:700;background:var(--ink);color:#fff;border-radius:3px;padding:0 4px}
.mini.miss{filter:grayscale(1)}
.mini.miss::after{content:"";position:absolute;inset:0;border:2px dashed var(--ink);border-radius:6px;background:rgba(247,249,252,.38)}
.mini.sel{outline:3px solid var(--ink);outline-offset:2px}
.sd.f-owned .cards .mini.miss,.sd.f-missing .cards .mini:not(.miss){display:none}
.miss-list li{display:grid;grid-template-columns:52px 1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.miss-list .row-n{font-size:15px}
.miss-list span:last-child{font-weight:700}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--raised);border-radius:22px 22px 0 0;padding:10px 18px 36px;box-shadow:0 -14px 40px -12px rgba(20,35,61,.35)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet .sh{display:flex;gap:14px;align-items:flex-start}
.sheet .card{width:74px;flex:none;padding:5px;gap:3px}
.sheet .card .nm{font-size:9px;white-space:nowrap;overflow:hidden}
.sheet .card .no{font-size:8px}
.sheet .num{font-size:40px}
.sheet h2{font-size:19px;font-weight:700;margin-top:6px}
.sheet p{font-size:13px;color:var(--muted)}
.sheet .pr{font-size:15px;color:var(--ink);font-weight:700;margin-top:4px}
.sheet .pair{display:flex;gap:10px;margin-top:14px}
.sheet .pair .secondary{padding:0 14px}
/* 6 custom collection */
.total{padding:4px 0 16px;border-bottom:1px solid var(--line)}
.total p{font-size:14px;color:var(--muted)}
.total .num{font-size:44px;margin:2px 0;font-variant-numeric:proportional-nums;letter-spacing:-.03em}
.total .sum{color:var(--ink);font-weight:600}
.up{color:#1F7A3A;font-weight:600;margin-left:4px}
.sortbar{display:flex;align-items:center;gap:8px;margin:14px 0 4px;font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
.sortbar .chips{flex-wrap:nowrap}
.copies{list-style:none;padding:0}
.copy{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.copy .t{font-size:13px;color:var(--muted)}.copy .t b{display:block;font-size:15px;color:var(--ink)}
.copy .p{text-align:right;font-weight:700;font-size:15px}
.copy .p small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
/* 7 new collection sheet */
.behind{flex:1;padding:4px 18px;filter:blur(1.5px);opacity:.55}
.scrim{position:absolute;inset:0;background:rgba(20,35,61,.42)}
.sheet.tall{top:150px;display:flex;flex-direction:column;padding-bottom:18px}
.sheet.tall .body{flex:1;overflow-y:auto}
.sheet.tall h2{font-size:22px;margin:0 0 4px}
label{display:block;font-size:14px;font-weight:700;margin:16px 0 6px}
label small{font-weight:500;color:var(--muted)}
.input{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:12px;font-size:16px}
.input:focus{border-color:var(--action);outline:none;box-shadow:0 0 0 3px rgba(35,70,166,.18)}
textarea.input{resize:none;height:76px;font-size:15px}
.sources{display:flex;flex-direction:column;gap:6px}
.src{display:grid;grid-template-columns:1fr 22px;align-items:center;gap:10px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);padding:10px 12px}
.src b{display:block;font-size:15px}.src span{font-size:13px;color:var(--muted)}
.src .box{width:20px;height:20px;border-radius:50%;border:1.5px solid #9FB0C8}
.src[aria-pressed=true]{border-color:var(--action);background:#EEF2FC}
.src[aria-pressed=true] .box{border:6px solid var(--action)}
.sheet .foot{margin:0 -18px;}
/* 8 settings */
.group{margin-top:18px}
.group h3{margin:0 0 6px;font-size:13px;color:var(--muted)}
.list{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-md);padding:0 12px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.item:last-child{border-bottom:0}
.item small{display:block;font-size:13px;color:var(--muted);font-weight:400;line-height:1.35;margin-top:2px}
.item b{font-weight:600}
.item .val{color:var(--muted);font-size:14px;white-space:nowrap}
.item .act{color:var(--action);font-weight:700;font-size:14px;white-space:nowrap}
button.item{width:100%;min-height:52px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer}
button.item:last-child{border-bottom:0}
/* switch: 46x28 track inside a 62x44 hit area */
.switch{flex:none;box-sizing:content-box;width:46px;height:28px;border-radius:22px;border:8px solid transparent;background-color:#8C9AB0;background-clip:padding-box;position:relative;padding:0;margin:-8px -8px -8px 0}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.switch[aria-checked=true]{background-color:var(--action)}
.switch[aria-checked=true]::after{transform:translateX(18px)}
.upd{color:var(--warn)}
.pv{display:block;margin-top:8px;font-size:13px;font-weight:600;color:var(--ink)}
.about{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.45}

<script>
const $=id=>document.getElementById(id);
// shared: icons for nav and app bars, gesture inset on every phone
const ICON={
  back:'<path d="M19 12H5M11 6l-6 6 6 6"/>',
  scan:'<path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><rect x="8.5" y="7.5" width="7" height="9" rx="1"/>',
  collections:'<rect x="8" y="3.5" width="11" height="15" rx="1.5"/><path d="M5 7.5v11a2 2 0 0 0 2 2h8.5"/>',
  search:'<circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/><circle cx="12" cy="12" r="6.3"/>'};
const svg=p=>`<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">${p}</svg>`;
document.querySelectorAll('.nav button').forEach(b=>{const name=b.textContent.trim().toLowerCase();b.querySelector('i')?.remove();
  b.insertAdjacentHTML('afterbegin',`<span class="ic">${svg(ICON[name])}</span>`);});
document.querySelectorAll('[data-icon]').forEach(b=>b.innerHTML=svg(ICON[b.dataset.icon]));
document.querySelectorAll('.phone').forEach(p=>p.insertAdjacentHTML('beforeend','<div class="gesture" aria-hidden="true"></div>'));

// generic single-select groups
document.querySelectorAll('[data-group]').forEach(g=>g.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));
}));
// 1 language packs
const packs=$('packs');
function sumPacks(){
  const on=[...packs.querySelectorAll('.pack[aria-pressed=true]')];
  const mb=on.reduce((s,p)=>s+ +p.dataset.mb,0);
  const n=on.length;
  $('dl').disabled=!n;
  $('dl').textContent=n?`Download ${n} pack${n>1?'s':''} (${mb} MB)`:'Pick at least one language';
}
packs.addEventListener('click',e=>{const b=e.target.closest('.pack');if(!b||b.disabled)return;
  b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');sumPacks();});
sumPacks();
// 2 ghost grid: one lit slot
for(let n=1;n<=60;n++){const i=document.createElement('i');if(n===1)i.className='lit';$('ghost').appendChild(i);}
// 4 search
const CARDS=[
  {n:'006/165',name:'Glurak ex',set:'151',lang:'DE',own:2,alias:'charizard'},
  {n:'006/165',name:'Charizard ex',set:'151',lang:'EN',own:0,alias:'glurak'},
  {n:'199/165',name:'Glurak ex',set:'151',lang:'DE',own:0,alias:'charizard'},
  {n:'006/165',name:'リザードンex',set:'SV2a',lang:'JP',own:0,alias:'glurak charizard lizardon'},
  {n:'125/197',name:'Glurak ex',set:'Obsidian Flames',lang:'DE',own:1,alias:'charizard'},
  {n:'223/197',name:'Charizard ex',set:'Obsidian Flames',lang:'EN',own:0,alias:'glurak'},
  {n:'004/165',name:'Glumanda',set:'151',lang:'DE',own:3,alias:'charmander'},
  {n:'005/165',name:'Glutexo',set:'151',lang:'DE',own:0,alias:'charmeleon'},
  {n:'025/165',name:'Pikachu',set:'151',lang:'DE',own:1,alias:''},
  {n:'151/165',name:'Mew ex',set:'151',lang:'EN',own:1,alias:''},
  {n:'001/165',name:'Bisasam',set:'151',lang:'DE',own:1,alias:'bulbasaur'},
];
function picked(id){return [...$(id).querySelectorAll('[aria-pressed=true]')].map(b=>b.dataset.v);}
function search(){
  const q=$('sq').value.trim().toLowerCase(), langs=picked('slang'), sets=picked('sset');
  const hits=CARDS.filter(c=>(!q||(c.name+' '+c.alias+' '+c.n).toLowerCase().includes(q))
    &&(langs.includes('all')||langs.includes(c.lang))&&(sets.includes('all')||sets.includes(c.set)));
  $('scount').textContent=q?`${hits.length} card${hits.length===1?'':'s'} for “${$('sq').value.trim()}”`:`${hits.length} cards`;
  $('sres').innerHTML=hits.length?hits.map(c=>`<li class="res"><span class="row-n">${c.n}</span><span class="t"><b>${c.name}</b>${c.set}, ${c.lang}${c.own?`<span class="own">${c.own} owned</span>`:''}</span><button class="addb" aria-label="Add ${c.name} ${c.n}">Add</button></li>`).join('')
    :'<li class="noresult">No cards match. Check the spelling or try the card number, like 006.</li>';
}
$('sq').addEventListener('input',search);
$('sclear').onclick=()=>{$('sq').value='';$('sq').focus();search();};
// language chips: multi, "all" exclusive
$('slang').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  const all=$('slang').querySelector('[data-v=all]');
  if(b===all){$('slang').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===all));}
  else{b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');
    const any=$('slang').querySelector('[aria-pressed=true]:not([data-v=all])');all.setAttribute('aria-pressed',!any);}
  search();});
$('sset').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  $('sset').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));search();});
search();
// 5 set grid (same ownership and type data as c-index.html)
const R=[[3,'grass'],[6,'fire'],[9,'water'],[15,'grass'],[22,'colorless'],[24,'grass'],[26,'lightning'],[28,'fighting'],[34,'psychic'],[36,'colorless'],[38,'fire'],[40,'colorless'],[45,'grass'],[47,'grass'],[49,'grass'],[51,'fighting'],[53,'colorless'],[55,'water'],[57,'fighting'],[59,'fire'],[62,'water'],[65,'psychic'],[68,'fighting'],[71,'grass'],[73,'water'],[76,'fighting'],[78,'fire'],[80,'water'],[82,'lightning'],[85,'colorless'],[87,'water'],[89,'psychic'],[91,'water'],[94,'psychic'],[95,'fighting'],[97,'psychic'],[99,'water'],[101,'lightning'],[103,'grass'],[105,'fighting'],[107,'fighting'],[108,'colorless'],[110,'psychic'],[112,'fighting'],[113,'colorless'],[114,'grass'],[115,'colorless'],[121,'water'],[122,'psychic'],[123,'grass'],[124,'psychic'],[125,'lightning'],[126,'fire'],[127,'grass'],[128,'colorless'],[131,'water'],[132,'colorless'],[136,'colorless'],[137,'colorless'],[141,'fighting'],[142,'colorless'],[143,'colorless'],[144,'water'],[145,'lightning'],[146,'fire'],[149,'colorless'],[151,'psychic'],[165,'trainer']];
const typeOf=n=>R.find(r=>n<=r[0])[1];
const col=t=>`var(--${t})`;
const owned=n=>[1,6,25,151].includes(n)||((n*37)%100)<52;
const NAMES={1:'Bisasam',2:'Bisaknosp',3:'Bisaflor ex',4:'Glumanda',5:'Glutexo',6:'Glurak ex',7:'Schiggy',8:'Schillok',9:'Turtok ex',10:'Raupy',13:'Hornliu',16:'Taubsi',19:'Rattfratz',23:'Rettan',24:'Arbok ex',25:'Pikachu',26:'Raichu',35:'Piepi',39:'Pummeluff',52:'Mauzi',54:'Enton',58:'Fukano',63:'Abra',65:'Simsala ex',74:'Kleinstein',92:'Nebulak',94:'Gengar',115:'Kangama ex',124:'Rossana ex',129:'Karpador',130:'Garados',133:'Evoli',143:'Relaxo',145:'Zapdos ex',150:'Mewtu',151:'Mew ex'};
const LIGHT=['lightning','colorless','trainer'];
const price=n=>((n*7)%23*0.35+0.2).toFixed(2).replace('.',',')+' €';
document.querySelectorAll('.sd').forEach(ph=>{
  const big=ph.querySelector('.big'),cards=ph.querySelector('.cards'),sheet=ph.querySelector('.sheet');
  const show=n=>{if(!sheet)return;const no=String(n).padStart(3,'0'),t=typeOf(n),k=x=>sheet.querySelector(`[data-k=${x}]`);
    k('face').style.background=col(t);k('face').style.color=LIGHT.includes(t)?'var(--ink)':'#fff';
    k('fname').textContent=NAMES[n]||'Card '+no;k('fno').textContent=no+'/165';
    k('num').innerHTML=`${no}<span>/165</span>`;k('name').textContent=NAMES[n]||'Card '+no;
    k('own').textContent=owned(n)?'In your collection':'Not in your collection yet';k('price').textContent=price(n);};
  for(let n=1;n<=165;n++){const no=String(n).padStart(3,'0'),own=owned(n),t=typeOf(n),label=`${no} ${NAMES[n]||''}`.trim();
    const i=document.createElement('button');i.textContent=no;i.dataset.n=n;
    i.className=own?'own'+(LIGHT.includes(t)?' lt':''):'miss';
    if(own)i.style.background=col(t);
    i.setAttribute('aria-label',`${label}, ${own?'owned':'missing'}`);
    if(n===24&&ph.dataset.view==='compact'){i.classList.add('sel');i.setAttribute('aria-pressed','true');}
    i.onclick=()=>{big.querySelectorAll('.sel').forEach(x=>{x.classList.remove('sel');x.removeAttribute('aria-pressed');});
      i.classList.add('sel');i.setAttribute('aria-pressed','true');show(n);};
    big.appendChild(i);
    const c=document.createElement('button');c.className='mini'+(own?'':' miss');c.style.background=col(t);
    c.setAttribute('aria-label',`${label}, ${own?'owned':'missing'}`);
    c.innerHTML=`<span class="nm">${NAMES[n]||''}</span><span class="art"></span><span class="no">${no}</span>${own?'':'<span class="tag">Missing</span>'}`;
    c.onclick=()=>{cards.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');show(n);};
    cards.appendChild(c);}
  if(sheet)show(24);
  const setView=v=>{ph.classList.toggle('v-cards',v==='cards');
    ph.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===v));};
  setView(ph.dataset.view);
  ph.querySelector('.seg').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setView(b.dataset.view);});
  const f=ph.querySelector('.sfilter');
  f.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    f.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));
    const v=b.dataset.v;ph.classList.remove('f-owned','f-missing');if(v!=='all')ph.classList.add('f-'+v);
    // compact grid keeps every position; filtered-out slots fade and leave the tab order
    big.querySelectorAll('button').forEach(x=>{const out=(v==='owned'&&x.classList.contains('miss'))||(v==='missing'&&x.classList.contains('own'));
      x.classList.toggle('off',out);x.tabIndex=out?-1:0;out?x.setAttribute('aria-hidden','true'):x.removeAttribute('aria-hidden');});});
});
// 3 no match: three sample causes
const NM={
  pack:{num:'151<span>/165</span>',read:'Not in your installed packs',type:'psychic',name:'ミュウex',no:'151/165',fx:'',
    title:'Looks like a Japanese card',text:'Install the Japanese pack to recognize it. The camera keeps scanning meanwhile.',
    acts:'<button class="primary">Install Japanese pack (41 MB)</button><button class="link">Not now</button>'},
  glare:{num:'0??<span>/165</span>',read:'Glare covers the number',type:'lightning',name:'Pikachu',no:'0??/165',fx:'glare',
    title:'Number hidden by glare',text:'Tilt the card away from the light. It is added as soon as the number is readable.',
    acts:'<button class="link">Send to Review instead</button>'},
  unknown:{num:'???',read:'No card with this number in your packs',type:'fire',name:'Promo',no:'SVP 101',fx:'',
    title:'Card not found',text:'It may be a promo or a set newer than your packs. Search for it by name.',
    acts:'<button class="primary">Search manually</button><button class="link">Skip this card</button>'}};
function nmState(v){const d=NM[v];$('nm-num').innerHTML=d.num;$('nm-read').textContent=d.read;
  $('nm-card').className=`card ${d.type} scan-card ${d.fx}`;$('nm-name').textContent=d.name;$('nm-no').textContent=d.no;
  $('nm-title').textContent=d.title;$('nm-text').textContent=d.text;$('nm-acts').innerHTML=d.acts;}
$('nm-state').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  $('nm-state').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));nmState(b.dataset.v);});
nmState('pack');
// 7 create enabled by name
$('cname').addEventListener('input',e=>$('create').disabled=!e.target.value.trim());
// 8 price source: the switch changes the example price
$('psrc').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  $('psrc').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  const cm=b.dataset.v==='cm';
  $('pv').textContent=cm?'Example: Glurak ex shows 38,90 € (Cardmarket trend)':'Example: Glurak ex shows $44.10 (TCGplayer market)';
  $('pnote').textContent=cm?'Cardmarket prices mix all card languages. A German card often sells for less than an English one.':'TCGplayer prices are US market prices for English cards.';});
// 8 switch
$('contrib').onclick=e=>e.currentTarget.setAttribute('aria-checked',e.currentTarget.getAttribute('aria-checked')!=='true');
</script>
