<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Index mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --page:#E6ECF3; --surface:#F7F9FC; --raised:#FFFFFF; --ink:#14233D; --muted:#56657E;
  --line:#D3DCE7; --empty:#E3E9F1; --action:#2346A6; --action-ink:#FFFFFF; --warn:#9A5A00;
  /* energy fills, tuned so their slot numbers reach 4.5:1 (white on the dark ones, ink on lightning/colorless/trainer) */
  --grass:#40813C; --fire:#CD4321; --water:#3274C6; --lightning:#E2AE1C; --psychic:#9555BF;
  --fighting:#A66239; --dark:#3B4055; --colorless:#A8A196; --trainer:#8C96A6;
  --r-lg:22px; --r-md:12px; --r-sm:7px;
}
*{box-sizing:border-box;margin:0}
body{background:var(--page);color:var(--ink);font-family:"Schibsted Grotesk",system-ui,sans-serif;
  line-height:1.4;padding:40px 16px 32px}
.num,.cand .n,.qty output{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--action);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.intro{max-width:1520px;margin:0 auto 32px;display:flex;flex-wrap:wrap;gap:8px 40px;align-items:baseline}
.intro h1{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.intro h1 small{display:block;font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:8px}
.intro p{max-width:56ch;color:var(--muted);font-size:17px}
.intro b{color:var(--ink)}
.row{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;max-width:1560px;margin:0 auto}
figure{display:flex;flex-direction:column;gap:12px;width:360px;max-width:100%}
figcaption{font-size:14px;color:var(--muted);padding-left:6px}
figcaption b{color:var(--ink);font-weight:700;margin-right:6px}
.replay{display:block;background:none;border:0;color:var(--action);font-weight:600;font-size:14px;min-height:44px;padding:0;text-decoration:underline}
.phone{width:360px;max-width:100%;height:780px;background:var(--surface);border-radius:40px;border:10px solid #1C2638;
  overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 30px 60px -30px rgba(20,35,61,.45)}
.status{height:30px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12px;font-weight:600}
.scroll{flex:1;overflow-y:auto;padding:4px 18px 18px}
.top{display:flex;justify-content:space-between;align-items:center;padding:2px 0 10px;min-height:48px}
.top h2{font-size:22px;font-weight:700;letter-spacing:-.01em}
.ghost{background:none;border:0;color:var(--action);font-weight:600;font-size:15px;min-height:44px;padding:0 6px}
/* bottom navigation: real buttons, 48px targets */
.nav{flex:none;display:flex;border-top:1px solid var(--line);background:var(--raised);padding:2px 4px 8px}
.nav button{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:none;border:0;font-size:12px;color:var(--muted);border-radius:var(--r-md)}
.nav i{width:22px;height:5px;border-radius:3px;background:var(--line)}
.nav [aria-current=page]{color:var(--ink);font-weight:700}.nav [aria-current=page] i{background:var(--ink)}
/* placeholder card face (stands in for artwork) */
.card{border-radius:9px;padding:7px;display:flex;flex-direction:column;gap:5px;color:#fff;aspect-ratio:63/88;position:relative;overflow:hidden}
.card .nm{display:flex;justify-content:space-between;font-weight:700;font-size:13px}
.card .art{flex:1;border-radius:4px;background:rgba(255,255,255,.22);position:relative;overflow:hidden}
.card .art::after{content:"";position:absolute;width:62%;aspect-ratio:1;border-radius:46% 54% 40% 60%;background:rgba(255,255,255,.35);left:20%;top:16%}
.card .tx{height:28%;border-radius:4px;background:rgba(255,255,255,.88)}
.card .no{font-size:10px;font-weight:600;align-self:flex-start;background:rgba(0,0,0,.35);padding:1px 5px;border-radius:4px}
.fire{background:var(--fire)}.grass{background:var(--grass)}.lightning{background:var(--lightning)}.psychic{background:var(--psychic)}
/* big number = signature type */
.num{font-weight:800;letter-spacing:-.045em;line-height:.9;font-size:72px}
.num span{color:var(--muted);font-weight:500}
.num.mid{font-size:40px}
/* chips: 36px visual, 44px hit area */
.chips{display:flex;flex-wrap:wrap;gap:8px 6px}
.chip{position:relative;min-height:36px;border:1.5px solid var(--line);background:var(--raised);border-radius:var(--r-sm);padding:0 11px;font-size:14px;font-weight:600}
.chip::before{content:"";position:absolute;inset:-5px -1px}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
/* scan */
.cam{background:#101722;color:#E8EEF7}
.cam .status{color:#E8EEF7}
.view{flex:1;position:relative;overflow:hidden;background:
  radial-gradient(120% 70% at 50% 45%,#2B3446 0%,#151C28 70%)}
.table{position:absolute;inset:auto -10% -6% -10%;height:46%;background:#3A3027;transform:perspective(500px) rotateX(28deg);opacity:.75}
.scan-card{position:absolute;width:140px;left:110px;top:150px;transform:rotate(-4deg);filter:saturate(.9) brightness(.92)}
.frame{position:absolute;left:99px;top:138px;width:162px;height:221px;transform:rotate(-4deg);border-radius:12px}
.frame b{position:absolute;width:26px;height:26px;border:3px solid #fff}
.frame b:nth-child(1){left:-3px;top:-3px;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.frame b:nth-child(2){right:-3px;top:-3px;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.frame b:nth-child(3){left:-3px;bottom:-3px;border-right:0;border-top:0;border-radius:0 0 0 10px}
.frame b:nth-child(4){right:-3px;bottom:-3px;border-left:0;border-top:0;border-radius:0 0 10px 0}
.read{position:absolute;left:0;right:0;top:50px;text-align:center}
.read .num{font-size:56px;color:#fff}
.read .num span{color:#A3B2C8}
.read p{font-size:14px;color:#C2CDDD;margin-top:6px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.auto{position:absolute;top:12px;left:16px;background:rgba(255,255,255,.12)}
.auto i{width:8px;height:8px;border-radius:50%;background:#62D27A}
@media (prefers-reduced-motion:no-preference){.auto i{animation:blink 1.6s ease-in-out infinite}}
@keyframes blink{50%{opacity:.3}}
.tray{flex:none;background:#F7F9FC;color:var(--ink);border-radius:20px 20px 0 0;padding:14px 18px 16px}
.counts{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.counts strong{font-size:34px;font-weight:800;letter-spacing:-.03em}
.counts strong small{font-size:15px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:4px}
.review-btn{min-height:44px;border:0;border-radius:999px;padding:0 16px;background:#FFF1D6;color:var(--warn);font-weight:700;font-size:14px}
.review-btn[data-empty]{background:#E3F1E6;color:#1F6A34}
.last{display:grid;grid-template-columns:40px 1fr;gap:4px 12px;align-items:center;background:var(--raised);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 8px 8px 10px;min-height:64px}
.last .card{width:40px;padding:3px;border-radius:5px}.last .card .nm,.last .card .no{display:none}.last .card .tx{height:22%}
.last .t{font-size:13px;color:var(--muted);min-width:0}
.last .t b{display:block;color:var(--ink);font-size:15px}
.last .card{grid-row:span 2}
.last .acts{display:flex;gap:6px;grid-column:2}
.mini-act{min-height:44px;padding:0 11px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:var(--surface);font-weight:700;font-size:14px;color:var(--action)}
.last.gone{grid-template-columns:1fr;font-size:14px;color:var(--ink);padding:10px 12px}
.done{width:100%;min-height:48px;margin-top:10px;background:var(--ink);color:#fff;border:0;border-radius:var(--r-md);font-weight:700;font-size:16px}
/* review */
.qpos{font-size:14px;color:var(--muted);font-weight:600}
.crop{display:flex;gap:14px;align-items:center;margin-bottom:4px}
.crop .card{width:64px;flex:none;padding:4px;gap:3px;border-radius:6px;transform:rotate(1.5deg)}
.crop .card .nm{font-size:8px}.crop .card .nm span:last-child{display:none}.crop .card .no{font-size:7px;padding:0 3px}
.crop .card.blur{filter:blur(.8px) saturate(.8)}
.crop .card.glare::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.85) 55%,transparent 70%)}
.crop p{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.35}
h3{font-size:14px;font-weight:700;margin:12px 0 6px}
.cands{display:flex;flex-direction:column;gap:6px}
.cand{display:grid;grid-template-columns:84px 1fr auto;align-items:center;gap:10px;min-height:50px;text-align:left;background:var(--raised);border:1.5px solid var(--line);border-radius:var(--r-md);padding:5px 12px}
.cand .n{font-size:19px;font-weight:800;letter-spacing:-.03em}
.cand .t{font-size:12.5px;color:var(--muted);line-height:1.3}.cand .t b{display:block;font-size:15px;color:var(--ink)}
.cand .m{font-size:13px;font-weight:600;color:var(--muted)}
.cand[aria-pressed=true]{border-color:var(--action);background:#EEF2FC}
.cand[aria-pressed=true] .m{color:var(--action)}
.flag{display:inline-block;font-size:12px;font-weight:700;color:var(--warn);margin-left:6px}
.donebox{padding:24px 6px 0}
.donebox h2{font-size:30px;font-weight:800;letter-spacing:-.025em;line-height:1.1;margin:18px 0 8px}
.donebox p{font-size:15px;color:var(--muted);max-width:30ch}
.tick{width:56px;height:56px;border-radius:50%;background:#E3F1E6;display:grid;place-items:center}
.tick::after{content:"";width:22px;height:11px;border:4px solid #1F6A34;border-top:0;border-right:0;transform:rotate(-45deg) translate(2px,-2px)}
/* sticky footer keeps quantity and the decision on screen */
.foot{flex:none;padding:10px 18px 14px;border-top:1px solid var(--line);background:var(--raised)}
.qtyrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.qtyrow b{font-size:15px}
.qty{display:flex;align-items:center;gap:12px}
.qty button{width:44px;height:44px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surface);font-size:20px;font-weight:600}
.qty output{font-size:22px;font-weight:800;min-width:2ch;text-align:center}
.btns{display:flex;gap:10px}
.primary{flex:1;min-height:48px;background:var(--action);color:var(--action-ink);border:0;border-radius:var(--r-md);padding:0 14px;font-weight:700;font-size:16px}
.secondary{min-height:48px;background:none;border:1.5px solid var(--line);border-radius:var(--r-md);padding:0 18px;font-weight:600}
/* collections */
.total{padding:4px 0 14px;border-bottom:1px solid var(--line)}
.total .num{font-size:44px;margin:2px 0;font-variant-numeric:proportional-nums;letter-spacing:-.03em}
.total .sum{color:var(--ink);font-weight:600}
.total p{font-size:14px;color:var(--muted)}
.up{color:#1F7A3A;font-weight:600;margin-left:4px}
.langs{display:flex;gap:6px;margin:14px 0 6px}
.langs .chip{padding:0 10px;font-size:13px}
.set{display:block;padding:12px 4px;margin:0 -4px;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;border-radius:var(--r-sm)}
.set:hover{background:#EEF2F8}
.set .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.set .hd b{font-size:16px}
.set .hd .val{font-size:13px;font-weight:600;color:var(--muted);margin-left:8px}
.set .hd>span{font-size:15px;font-weight:700}
.set .hd small{color:var(--muted);font-weight:500}
/* overview grids are summaries: owned = filled, missing = outlined */
.slots{display:grid;grid-template-columns:repeat(15,1fr);gap:2px}
.slots i{aspect-ratio:1;border-radius:3px;box-shadow:inset 0 0 0 1px #B4C1D3}
.slots i.own{box-shadow:none}
.slots.thin{grid-template-columns:repeat(33,1fr);gap:1.5px}
.slots.thin i{border-radius:2px}
.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.sub{font-size:13px;color:var(--muted);font-weight:600;margin:20px 0 0}
.custom{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;margin:0 -4px;min-height:56px;color:inherit;text-decoration:none;border-radius:var(--r-sm)}
.custom b{display:block}.custom span{font-size:14px;color:var(--muted)}
.custom>span{font-weight:700;color:var(--ink)}
/* detail */
.dhead{display:flex;gap:14px;align-items:flex-start;margin-bottom:6px}
.dhead .card{width:112px;flex:none}
.dhead>div:last-child{min-width:0}
.dhead .num{font-size:46px;margin-top:6px}
.dhead h2{font-size:22px;font-weight:700;margin-top:10px;line-height:1.15}
.dhead p{font-size:14px;color:var(--muted)}
.strip{margin:12px 0 4px}
.strip .slots{grid-template-columns:repeat(33,1fr);gap:1.5px}
.strip .slots i{border-radius:2px}
.strip .slots i.here{outline:2px solid var(--ink);outline-offset:1px}
.price{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline;background:var(--raised);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 14px 4px}
.price .big{font-size:34px;font-weight:800;letter-spacing:-.03em}
.price .lbl{font-size:13px;color:var(--muted)}
.price .usd{font-size:16px;font-weight:600;text-align:right}
.price a{grid-column:1/-1;display:flex;align-items:center;min-height:44px;color:var(--action);font-weight:600;font-size:15px;margin-top:4px;text-decoration:none}
.price a:hover{text-decoration:underline}
.copies{list-style:none;padding:0}
.copies li{display:grid;grid-template-columns:1fr auto;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}
.copies li b{display:block;color:var(--ink);font-size:15px}
.copies li span:last-child{text-align:right}
.copies li span:last-child b{display:block}
.add{width:100%;min-height:48px;margin-top:14px;background:none;border:1.5px dashed #8C9AB0;border-radius:var(--r-md);font-weight:700;color:var(--action)}
.note{max-width:1520px;margin:28px auto 0;text-align:center;font-size:13px;color:var(--muted)}
@media (max-width:420px){.intro h1{font-size:34px}.phone{height:740px}}
</style>
</head>
<body>
<header class="intro">
  <h1>Index<small>Direction C, working title “Setlist”</small></h1>
  <p>A catalogue for completionists. <b>The collector number is the main type</b> on every screen, and each set appears as a grid of numbered slots, so you can see at a glance which cards are still missing.</p>
</header>

<main class="row">
<!-- 1 Live scan -->
<figure><div class="phone cam" id="scanphone">
  <div class="status"><span>14:32</span><span>87%</span></div>
  <div class="view" aria-label="Camera viewfinder">
    <span class="pill auto"><i></i>Auto scan</span>
    <div class="read"><div class="num">006<span>/165</span></div><p>Glurak ex, 151, German</p></div>
    <div class="table"></div>
    <div class="card fire scan-card" aria-hidden="true"><div class="nm"><span>Glurak ex</span><span>330</span></div><div class="art"></div><div class="tx"></div><div class="no">006/165</div></div>
    <div class="frame" aria-hidden="true"><b></b><b></b><b></b><b></b></div>
  </div>
  <div class="tray">
    <div class="counts"><strong><span id="scount">23</span><small>scanned</small></strong><button class="review-btn" id="toreview">3 to review</button></div>
    <div class="last" id="last" role="status">
      <div class="card grass" aria-hidden="true"><div class="art"></div><div class="tx"></div></div>
      <div class="t"><b>001/165 Bisasam</b>Added: 151, German, 0,35 €</div>
      <div class="acts"><button class="mini-act" id="undo" aria-label="Undo adding 001/165 Bisasam">Undo</button><button class="mini-act" id="edit" aria-label="Edit 001/165 Bisasam">Edit</button></div>
    </div>
    <button class="done">Finish scanning</button>
  </div>
</div><figcaption><b>Live scan</b>No shutter: each card is added as soon as its number is read. Unsure cards go to Review without stopping the camera. Try Undo, Edit and “3 to review”.</figcaption></figure>

<!-- 2 Review -->
<figure><div class="phone" id="reviewphone">
  <div class="status"><span>14:35</span><span>86%</span></div>
  <p class="sr-only" id="rvlive" aria-live="polite"></p>
  <div class="scroll" id="rv"></div>
  <div class="foot" id="rvfoot">
    <div class="qtyrow" id="qtyrow"><b id="qlabel">Quantity</b><div class="qty"><button id="minus" aria-label="One less">−</button><output id="q" aria-labelledby="qlabel">1</output><button id="plus" aria-label="One more">+</button></div></div>
    <div class="btns"><button class="secondary" id="skip">Skip</button><button class="primary" id="confirm">Confirm</button></div>
  </div>
</div><figcaption><b>Review queue</b>Unsure scans wait here; the number decides between the matches. Confirm and Skip move to the next card. <button class="replay" id="replay">Start the queue again</button></figcaption></figure>

<!-- 3 Collections -->
<figure><div class="phone">
  <div class="status"><span>14:40</span><span>85%</span></div>
  <div class="scroll">
    <div class="top"><h2>Collections</h2><button class="ghost">New</button></div>
    <div class="total">
      <p>Collection value, Cardmarket trend</p>
      <div class="num">1.284,60 €</div>
      <p class="sum">All cards, 412 copies <span class="up">+18,20 € this week</span></p>
    </div>
    <div class="langs chips" data-group="lang" data-multi aria-label="Card languages shown">
      <button class="chip" aria-pressed="true">EN</button><button class="chip" aria-pressed="true">DE</button>
      <button class="chip" aria-pressed="false">FR</button><button class="chip" aria-pressed="false">IT</button><button class="chip" aria-pressed="false">JP</button>
    </div>
    <a class="set" href="#" aria-label="151, 87 of 165 cards, 612,30 €. Open set">
      <div class="hd"><b>151<span class="val">612,30 €</span></b><span>87<small>/165</small></span></div>
      <div class="slots" id="g151" aria-hidden="true"></div>
      <div class="legend" aria-hidden="true"><span>001</span><span>165</span></div>
    </a>
    <a class="set" href="#" aria-label="Prismatic Evolutions, 41 of 131 cards, 238,10 €. Open set"><div class="hd"><b>Prismatic Evolutions<span class="val">238,10 €</span></b><span>41<small>/131</small></span></div><div class="slots thin" data-total="131" data-own="41" aria-hidden="true"></div></a>
    <a class="set" href="#" aria-label="Surging Sparks, 58 of 191 cards, 96,75 €. Open set"><div class="hd"><b>Surging Sparks<span class="val">96,75 €</span></b><span>58<small>/191</small></span></div><div class="slots thin" data-total="191" data-own="58" aria-hidden="true"></div></a>
    <a class="set" href="#" aria-label="Pitch Black, 12 of 120 cards, 41,20 €. Open set"><div class="hd"><b>Pitch Black<span class="val">41,20 €</span></b><span>12<small>/120</small></span></div><div class="slots thin" data-total="120" data-own="12" aria-hidden="true"></div></a>
    <p class="sub">Japanese sets</p>
    <a class="set" href="#" aria-label="SV2a, Japanese, 19 of 165 cards, 188,40 €. Open set"><div class="hd"><b>SV2a<span class="val">188,40 €</span></b><span>19<small>/165</small></span></div><div class="slots thin" data-total="165" data-own="19" aria-hidden="true"></div></a>
    <p class="sub">Your collections</p>
    <a class="custom" href="#"><div><b>Trade binder</b><span>36 cards</span></div><span>212 €</span></a>
  </div>
  <nav class="nav" aria-label="Main"><button><i></i>Scan</button><button aria-current="page"><i></i>Collections</button><button><i></i>Search</button><button><i></i>Settings</button></nav>
</div><figcaption><b>Collections</b>Every set shows as numbered slots: filled when owned, outlined when missing. Tap a set to open it.</figcaption></figure>

<!-- 4 Detail -->
<figure><div class="phone">
  <div class="status"><span>14:42</span><span>85%</span></div>
  <div class="scroll">
    <div class="top"><button class="ghost">Back</button><button class="ghost">Share</button></div>
    <div class="dhead">
      <div class="card fire" aria-hidden="true"><div class="nm"><span>Glurak ex</span><span>330</span></div><div class="art"></div><div class="tx"></div><div class="no">006/165</div></div>
      <div><div class="num">006<span>/165</span></div><h2>Glurak ex</h2><p>151, German print</p></div>
    </div>
    <div class="strip"><div class="slots" id="gstrip" role="img" aria-label="Position 6 of 165 in 151"></div></div>
    <h3>Price</h3>
    <div class="price">
      <span class="big">38,90 €</span><span class="usd">$44.10</span>
      <span class="lbl">Cardmarket trend, all languages</span><span class="lbl">TCGplayer market</span>
      <a href="#">Open on Cardmarket (German offers)</a>
    </div>
    <h3>Your copies</h3>
    <ul class="copies">
      <li><span><b>Holo, NM</b>Bought 12 Mar 2026</span><span><b>32,00 €</b>+6,90 €</span></li>
      <li><span><b>Holo, LP</b>Bought 2 Aug 2025</span><span><b>24,50 €</b>+14,40 €</span></li>
    </ul>
    <button class="add">Add copy</button>
  </div>
</div><figcaption><b>Card detail</b>The number comes first, then the price, then your copies.</figcaption></figure>
</main>
<p class="note">Sample data. Card faces are placeholders, not real artwork.</p>

<script>
const $=id=>document.getElementById(id);
// pressed toggles via delegation, so re-rendered review content works too
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-group] button');if(!b)return;
  const g=b.closest('[data-group]');
  if(g.hasAttribute('data-multi')){b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');return;}
  g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));
});
const q=$('q');
$('plus').onclick=()=>q.value=+q.value+1;
$('minus').onclick=()=>q.value=Math.max(1,+q.value-1);

// ---------- review queue ----------
const QUEUE=[
  {type:'lightning',name:'Pikachu',face:'0?5/1??',no:'025',tot:'/1??',fx:'glare',
   why:'Glare hid the set total. Pick the right card.',
   cands:[['025/165','Pikachu','151','94 %'],['025/191','Pikachu','Surging Sparks','71 %'],['025/165','ピカチュウ','SV2a, Japanese','58 %']],variant:'Normal'},
  {type:'psychic',name:'Mew ex',face:'1?1/165',no:'1?1',tot:'/165',fx:'blur',
   why:'The number is blurred. Pick the right card.',
   cands:[['151/165','Mew ex','151','82 %'],['193/165','Mew ex','151, full art','61 %'],['205/165','Mew ex','151, gold','37 %']],variant:'Holo'},
  {type:'fire',name:'Glurak ex',face:'006/165',no:'006',tot:'/165',fx:'',
   why:'Number read. Holo and reverse holo look alike in photos, so check the variant.',
   cands:[['006/165','Glurak ex','151, German','97 %'],['006/165','Charizard ex','151, English','41 %'],['199/165','Glurak ex','151, German','22 %']],variant:null,checkVariant:true},
];
const EDIT={type:'grass',name:'Bisasam',face:'001/165',no:'001',tot:'/165',fx:'',
   why:'Added during scanning. Change anything that is wrong.',
   cands:[['001/165','Bisasam','151, German','Added']],variant:'Normal'};
let pos=0,added=0,skipped=0,mode='queue';
const VARIANTS=['Normal','Holo','Reverse holo','1st edition'],CONDS=['NM','LP','MP','HP','Poor'];
function cardFace(it){return `<div class="card ${it.type} ${it.fx}" role="img" aria-label="Your photo of ${it.name}"><div class="nm"><span>${it.name}</span></div><div class="art"></div><div class="tx"></div><div class="no">${it.face}</div></div>`;}
function renderItem(it,head,posText){
  $('rv').innerHTML=`
    <div class="top"><h2>${head}</h2><span class="qpos">${posText}</span></div>
    <div class="crop">${cardFace(it)}<div><div class="num mid">${it.no}<span>${it.tot}</span></div><p>${it.why}</p></div></div>
    <h3 id="h-match">${it.cands.length>1?'Best matches':'Card'}</h3>
    <div class="cands" data-group="cand" role="group" aria-labelledby="h-match">${it.cands.map((c,k)=>`<button class="cand" aria-pressed="${k===0}"><span class="n">${c[0]}</span><span class="t"><b>${c[1]}</b>${c[2]}</span><span class="m">${c[3]}</span></button>`).join('')}</div>
    <h3 id="h-var">Variant${it.checkVariant?'<span class="flag">Check this</span>':''}</h3>
    <div class="chips" data-group="variant" role="group" aria-labelledby="h-var">${VARIANTS.map(v=>`<button class="chip" aria-pressed="${v===it.variant}">${v}</button>`).join('')}</div>
    <h3 id="h-cond">Condition</h3>
    <div class="chips" data-group="cond" role="group" aria-labelledby="h-cond">${CONDS.map((c,k)=>`<button class="chip" aria-pressed="${k===0}">${c}</button>`).join('')}</div>`;
  q.value=1;$('qtyrow').hidden=false;$('skip').hidden=false;
}
function render(){
  if(mode==='edit'){
    renderItem(EDIT,'Edit card','From scanning');
    $('skip').textContent='Cancel';$('confirm').textContent='Save changes';
    $('rvlive').textContent='Editing 001/165 Bisasam';return;
  }
  $('skip').textContent='Skip';$('confirm').textContent='Confirm';
  if(pos<QUEUE.length){
    const it=QUEUE[pos];renderItem(it,'Review',`${pos+1} of ${QUEUE.length}`);
    $('rvlive').textContent=`Card ${pos+1} of ${QUEUE.length}: ${it.name}`;
  }else{
    $('rv').innerHTML=`<div class="top"><h2>Review</h2><span class="qpos">${QUEUE.length} of ${QUEUE.length}</span></div><div class="donebox"><div class="tick" aria-hidden="true"></div>
      <h2>Review done</h2><p>All ${QUEUE.length} checked. ${added} added, ${skipped} skipped.</p>
      ${skipped?'<p style="margin-top:10px">Skipped cards wait in Review, so you can sort them out later.</p>':''}</div>`;
    $('qtyrow').hidden=true;$('skip').hidden=true;$('confirm').textContent='Back to scanning';
    $('rvlive').textContent=`Review done. ${added} added, ${skipped} skipped.`;
  }
  const btn=$('toreview');
  const remaining=Math.max(0,QUEUE.length-pos)+skipped;
  btn.textContent=remaining?`${remaining} to review`:'Nothing to review';
  btn.toggleAttribute('data-empty',!remaining);
}
$('confirm').onclick=()=>{
  if(mode==='edit'){mode='queue';render();$('last').querySelector('.t').innerHTML='<b>001/165 Bisasam</b>Updated: 151, German, 0,35 €';return;}
  if(pos>=QUEUE.length){$('toreview').focus();return;}
  added++;pos++;render();
};
$('skip').onclick=()=>{
  if(mode==='edit'){mode='queue';render();return;}
  skipped++;pos++;render();
};
$('replay').onclick=()=>{pos=0;added=0;skipped=0;mode='queue';render();};
$('toreview').onclick=()=>{
  $('reviewphone').scrollIntoView({block:'nearest',inline:'nearest'});
  const first=$('rv').querySelector('button')||$('confirm');first.focus({preventScroll:true});
};
// ---------- scan tray: undo and edit the last auto-added card ----------
$('undo').onclick=()=>{
  $('scount').textContent=+$('scount').textContent-1;
  const l=$('last');l.classList.add('gone');
  l.innerHTML='<span>Removed 001/165 Bisasam. Keep scanning.</span>';
};
$('edit').onclick=()=>{mode='edit';render();$('toreview').onclick();};
render();

// ---------- slot grids ----------
// approximate energy type per 151 slot (Kanto order), trainers grey
const R=[[3,'grass'],[6,'fire'],[9,'water'],[15,'grass'],[22,'colorless'],[24,'grass'],[26,'lightning'],[28,'fighting'],[34,'psychic'],[36,'colorless'],[38,'fire'],[40,'colorless'],[45,'grass'],[47,'grass'],[49,'grass'],[51,'fighting'],[53,'colorless'],[55,'water'],[57,'fighting'],[59,'fire'],[62,'water'],[65,'psychic'],[68,'fighting'],[71,'grass'],[73,'water'],[76,'fighting'],[78,'fire'],[80,'water'],[82,'lightning'],[85,'colorless'],[87,'water'],[89,'psychic'],[91,'water'],[94,'psychic'],[95,'fighting'],[97,'psychic'],[99,'water'],[101,'lightning'],[103,'grass'],[105,'fighting'],[107,'fighting'],[108,'colorless'],[110,'psychic'],[112,'fighting'],[113,'colorless'],[114,'grass'],[115,'colorless'],[121,'water'],[122,'psychic'],[123,'grass'],[124,'psychic'],[125,'lightning'],[126,'fire'],[127,'grass'],[128,'colorless'],[131,'water'],[132,'colorless'],[136,'colorless'],[137,'colorless'],[141,'fighting'],[142,'colorless'],[143,'colorless'],[144,'water'],[145,'lightning'],[146,'fire'],[149,'colorless'],[151,'psychic'],[165,'trainer']];
const typeOf=n=>R.find(r=>n<=r[0])[1];
const col=t=>`var(--${t})`;
const owned=n=>[1,6,25,151].includes(n)||((n*37)%100)<52;
function fill(el,total,mark){
  for(let n=1;n<=total;n++){const i=document.createElement('i');
    if(owned(n)){i.className='own';i.style.background=col(typeOf(n));}
    if(n===mark)i.classList.add('here');
    el.appendChild(i);}
}
fill($('g151'),165);
fill($('gstrip'),165,6);
document.querySelectorAll('.slots.thin').forEach(el=>{
  const t=+el.dataset.total,o=+el.dataset.own;
  for(let n=1;n<=t;n++){const i=document.createElement('i');if(((n*53)%t)<o){i.className='own';i.style.background=col(R[(n*7)%R.length][1]);}el.appendChild(i);}
});
</script>
</body>
</html>
