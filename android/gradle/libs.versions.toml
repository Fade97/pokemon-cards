[versions]
agp = "9.5.2"
# AGP 9 compiles Kotlin itself (built-in Kotlin). Declaring KGP raises the Kotlin version above AGP's default;
# the Compose compiler plugin must use the same version.
kotlin = "2.4.21"
ksp = "2.3.14"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
composeBom = "2026.11.01"
navigationCompose = "2.10.2"
lifecycle = "2.11.0"
room = "2.8.5"
camerax = "1.7.0"
mlkitTextRecognition = "16.0.1"
litert = "2.4.0"
# Python prototype (ml/uv.lock) is on 5.0.0: 5.0.0's arm64 libc++_shared.so is not 16 KB aligned, and
# opencv-python 5.1 is not on PyPI yet. Re-run RecognitionParityTest after changing either side; align when possible.
opencv = "5.1.0"
coil = "3.6.3"
# Shared with coil-network-okhttp (built against 4.12; OkHttp 5 is binary compatible): the price and pack
# clients share its OkHttpClient. Checked 2026-11-17 on the emulator: pack download, prices, card images.
okhttp = "5.5.1"
coroutines = "1.11.0"
work = "2.12.0"
# Open-source licenses screen (#136): the Gradle plugin collects licenses at build time; the app reads its JSON.
aboutlibraries = "15.3.0"
junit = "4.13.2"
robolectric = "4.18.1"
androidxTestCore = "1.7.0"
androidxTestExtJunit = "1.3.0"
androidxTestRunner = "1.7.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
# Bundled models: recognition works offline without a Play services download.
mlkit-text-recognition-latin = { module = "com.google.mlkit:text-recognition", version.ref = "mlkitTextRecognition" }
litert = { module = "com.google.ai.edge.litert:litert", version.ref = "litert" }
# GPU accelerator for CompiledModel (native library only); the embedder falls back to the CPU without it.
litert-gpu = { module = "com.google.ai.edge.litert:litert-gpu", version.ref = "litert" }
opencv = { module = "org.opencv:opencv", version.ref = "opencv" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "work" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
aboutlibraries = { id = "com.mikepenz.aboutlibraries.plugin.android", version.ref = "aboutlibraries" }
