# SPDX-License-Identifier: GPL-3.0-or-later
[project]
name = "cardindex-ml"
version = "0.1.0"
description = "Card recognition prototype (detection, embedding, kNN, rerank) for the CardIndex app"
license = "GPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.9",
    "torchvision",
    "timm>=1.0",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "faiss-cpu>=1.8",
    "pillow>=10",
    "imagehash>=4.3",
    "requests>=2.31",
    "tqdm",
    "matplotlib",
    "onnx",
    "onnxruntime",
    "onnxscript",
    "kornia>=0.8",
]

[project.optional-dependencies]
# real OCR for the collector number (pipeline side)
ocr = ["easyocr"]
# independent VLM labeler for real photos
labeler = ["transformers>=4.57", "accelerate", "bitsandbytes>=0.45", "huggingface_hub"]
# run exported .tflite models on Windows (app-faithful real-photo evaluation)
litert = ["ai-edge-litert>=2.3"]

[tool.uv]
package = false
# easyocr pulls opencv-python-headless, which clashes with opencv-python (both ship the cv2 package).
override-dependencies = ["opencv-python-headless; sys_platform == 'never'"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
# The code is wrapped at 120 columns. `ruff format` is not enforced: it would rewrite most files.
line-length = 120
target-version = "py312"
src = [".", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",  # a few lines run past 120 (eval_real.py embeds an HTML page); not worth wrapping
    "E731",  # small lambda helpers are fine
    "E741",  # math-style names (l, I) are used on purpose
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
